<!DOCTYPE html>

<head>

  <meta name="theme-color" content="#f7dde4" />
  <meta name="color-scheme" content="light" />

  <!-- Vista previa al compartir el enlace (edita las imágenes si quieres) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Feliz cumpleaños · un libro para ti" />
  <meta property="og:description" content="Un pequeño libro de recuerdos hecho con cariño." />
  <meta property="og:image" content="assets/icons/og-cover.png" />

  <!-- Iconos / PWA básica -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

  <!-- Tipografías locales: no dependen de Google Fonts al abrir el regalo -->

  <link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="css/base.css" />

  <style>
    /* Pintura rápida antes de que carguen los estilos: evita el destello blanco */
    html, body { background: #f7e4e8; margin: 0; }
    #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
      background: radial-gradient(120% 90% at 50% 20%, #fffaf7 0%, #fbe6ea 55%, #f3ccd7 100%);
      z-index: 999; text-align: center; transition: opacity .5s ease, visibility .5s; }
    #boot .boot-heart { width: 54px; height: 54px; margin: auto; color: #b95f7d; animation: bootPulse 1.8s ease-in-out infinite; }
    #boot p { font: 500 13px/1.4 system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #8a5f70; margin: 0; }
    #boot.is-done { opacity: 0; visibility: hidden; }
    @keyframes bootPulse { 0%,100% { transform: scale(1); opacity: .75 } 50% { transform: scale(1.08); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #boot .boot-heart { animation: none } }
  </style>
</head>
<body>
  <a class="skip-link" href="#pages">Ir al contenido del libro</a>

    <p>Preparando tu libro</p>

  <div class="app" id="app">
    <!-- Barra superior -->
    <header class="topbar" id="topbar">
      <button class="brand" id="brand" type="button" aria-label="de tomi para ro · Volver a la portada">
        <span class="brand__seal" aria-hidden="true"><span id="brand-initial">R</span></span>
        <span class="brand__text">de tomi para ro</span>
      </button>

      <div class="chapter" aria-hidden="true">
        <span class="chapter__kicker" id="chapter-kicker">Capítulo 01</span>
        <span class="chapter__name" id="chapter-name">Portada</span>
      </div>

      <div class="topbar__actions">
        <button class="icon-btn music-btn" id="music-btn" type="button" aria-label="Activar música" aria-pressed="false" hidden>
          <span class="music-btn__rings" aria-hidden="true"><span></span><span></span><span></span></span>
          <svg class="icon music-btn__on" aria-hidden="true"><use href="#i-music"></use></svg>
          <svg class="icon music-btn__off" aria-hidden="true"><use href="#i-music"></use></svg>
        </button>
        <button class="icon-btn" id="toc-btn" type="button" aria-label="Abrir el índice" aria-expanded="false" aria-controls="toc">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
      </div>
    </header>

    <!-- Escena: el libro y la navegación -->
    <main class="stage" id="main">
      <div class="ambient" aria-hidden="true">
        <svg class="ambient__sprig ambient__sprig--left" viewBox="0 0 220 620">
          <path d="M118 618C92 500 86 380 96 262c8-90 35-158 78-208" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
          <g fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55">
            <path d="M101 480c-42-8-66-40-64-84 40 6 66 36 64 84ZM104 414c38-10 58-38 58-80-36 8-58 34-58 80ZM99 344c-34-6-54-32-52-70 32 4 54 28 52 70ZM102 292c30-8 46-30 46-62-28 6-46 26-46 62Z"/>
            <path d="M176 104c22-6 34-22 34-46-20 4-34 20-34 46ZM160 158c-24-4-38-22-38-48 22 4 38 20 38 48Z"/>
          </g>
          <g fill="currentColor" opacity=".4">
            <circle cx="170" cy="60" r="3"/><circle cx="54" cy="520" r="2.4"/><circle cx="150" cy="230" r="2.6"/>
          </g>
        </svg>
        <svg class="ambient__sprig ambient__sprig--right" viewBox="0 0 220 620">
          <path d="M118 618C92 500 86 380 96 262c8-90 35-158 78-208" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
          <g fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55">
            <path d="M101 480c-42-8-66-40-64-84 40 6 66 36 64 84ZM104 414c38-10 58-38 58-80-36 8-58 34-58 80ZM99 344c-34-6-54-32-52-70 32 4 54 28 52 70ZM102 292c30-8 46-30 46-62-28 6-46 26-46 62Z"/>
            <path d="M176 104c22-6 34-22 34-46-20 4-34 20-34 46ZM160 158c-24-4-38-22-38-48 22 4 38 20 38 48Z"/>
          </g>
        </svg>
      </div>

      <div class="book-shell">
        <div class="book" id="book">
          <div class="pages" id="pages"></div>
          <div class="book__gutter" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Flechas laterales (solo computadora) -->
      <button class="edge-nav edge-nav--prev" id="edge-prev" type="button" aria-label="Página anterior">
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
      </button>
      <button class="edge-nav edge-nav--next" id="edge-next" type="button" aria-label="Página siguiente">
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
      </button>

      <!-- Navegación inferior -->
      <nav class="navbar" id="navbar" aria-label="Navegación del libro">
        <button class="nav-btn" id="nav-prev" type="button" aria-label="Página anterior">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
        </button>

        <button class="nav-status" id="nav-status" type="button" aria-controls="toc">
          <span class="nav-status__count"><span id="page-current">01</span><span class="nav-status__sep">/</span><span id="page-total">10</span></span>
          <span class="nav-status__name" id="nav-name">Portada</span>
          <span class="nav-status__progress" aria-hidden="true"><span id="nav-progress"></span></span>
          <span class="visually-hidden">Abrir el índice del libro</span>
        </button>

        <button class="nav-btn" id="nav-next" type="button" aria-label="Página siguiente">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        </button>
      </nav>

      <p class="swipe-hint" id="swipe-hint" aria-hidden="true">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        Desliza para pasar
      </p>
    </main>
  </div>

  <!-- Índice / tabla de contenido -->
  <div class="drawer" id="toc" aria-hidden="true">
    <div class="drawer__backdrop" data-close-toc></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="toc-title">
      <header class="drawer__head">
        <div>
          <p class="eyebrow">de tomi para ro</p>
          <h2 class="drawer__title" id="toc-title">Índice del libro</h2>
          <p class="drawer__subtitle">Puedes ir a cualquier página</p>
        </div>
        <button class="icon-btn icon-btn--plain" id="toc-close" type="button" aria-label="Cerrar el índice">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </header>
      <nav class="drawer__nav" aria-label="Páginas del libro">
        <ol class="toc-list" id="toc-list"></ol>
      </nav>
      <footer class="drawer__foot">
        <svg class="icon" aria-hidden="true"><use href="#i-heart"></use></svg>
        <span>Hecho a mano, página por página.</span>
      </footer>
    </aside>
  </div>

  <!-- Visor de imágenes ampliadas -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Imagen ampliada" aria-hidden="true">
    <div class="lightbox__backdrop" data-close-lightbox></div>
    <button class="lightbox__close" id="lightbox-close" type="button" aria-label="Cerrar imagen">
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="Imagen anterior">
      <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="Imagen siguiente">
      <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
    </button>
    <figure class="lightbox__figure">
      <div class="lightbox__mat">
        <img id="lightbox-img" alt="" />
      </div>
      <figcaption class="lightbox__caption" id="lightbox-caption"></figcaption>
    </figure>
    <div class="lightbox__meta">
      <span id="lightbox-count" class="lightbox__count"></span>
      <span class="lightbox__hint">Desliza o usa las flechas</span>
    </div>
  </div>

  <!-- Avisos breves -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Corazones de la página final -->
  <div class="hearts-layer" id="hearts-layer" aria-hidden="true"></div>

  <p class="visually-hidden" id="live-region" aria-live="polite"></p>

  <noscript>
    <div class="noscript">
      <p>Este libro necesita JavaScript para pasar sus páginas.</p>
      <p>Actívalo en tu navegador y vuelve a abrirlo. 💕</p>
    </div>
  </noscript>

  <!-- Dependencias locales, sin CDN ni conexiones externas -->
  <script src="vendor/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/art.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/music.js"></script>
  <script src="js/app.js"></script>
</body>

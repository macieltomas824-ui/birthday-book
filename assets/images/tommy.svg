<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Ilustración de Tommy, un gato naranja de ojos verdes">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efc39a"/>
      <stop offset="1" stop-color="#dda774"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeedb"/>
      <stop offset="1" stop-color="#f3ddc0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fce9dd"/>
      <stop offset="1" stop-color="#fce9dd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <circle cx="400" cy="430" r="330" fill="url(#glow)"/>
  <ellipse cx="400" cy="748" rx="220" ry="34" fill="#d9a9b8" opacity=".26" filter="url(#soft)"/>

  <g stroke="#c3a06a" stroke-width="3" stroke-linecap="round" opacity=".65">
    <path d="M160 300h18M169 291v18"/>
    <path d="M646 250h14M653 243v14"/>
    <path d="M605 410h10M610 405v10"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="Ilustración de un ramo de flores envuelto en papel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe9ec"/>
      <stop offset="1" stop-color="#f3cdd7"/>
    </linearGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f4e3d7"/>
    </linearGradient>
    <radialGradient id="rose" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f8c3d0"/>
      <stop offset="1" stop-color="#d97f9a"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#bg)"/>
  <circle cx="450" cy="500" r="360" fill="#fff" opacity=".22"/>
  <g opacity=".35" stroke="#fff" stroke-width="2">
    <path d="M80 160h90M125 115v90M760 900h70M795 865v70"/>
  </g>

  <ellipse cx="450" cy="940" rx="260" ry="40" fill="#b98495" opacity=".3" filter="url(#shadow)"/>

  <!-- papel -->
  <path d="M300 580L230 900c90 50 350 50 440 0l-70-320z" fill="url(#wrap)"/>
  <path d="M300 580L265 880c60 22 120 30 185 30s125-8 185-30l-35-300z" fill="none" stroke="#e8d3c5" stroke-width="2"/>
  <path d="M330 640l-40 250M570 640l40 250" stroke="#eeded2" stroke-width="3" opacity=".9"/>

  <!-- tallos -->
  <g fill="none" stroke="#84987c" stroke-width="7" stroke-linecap="round">
    <path d="M430 620c-20-120-10-200 30-280"/>
    <path d="M470 630c10-130 10-220 40-300"/>
    <path d="M380 640c-70-110-100-180-110-260"/>
    <path d="M520 640c70-100 100-160 120-240"/>
    <path d="M450 640c0-120 0-200 0-270"/>
  </g>
  <g fill="#a9b9a1">
    <path d="M445 500c-40-8-62-30-66-58 34 4 58 24 66 58z"/>
    <path d="M455 520c38-8 58-28 62-54-32 4-54 22-62 54z"/>
    <path d="M380 560c-34-4-52-22-56-44 28 2 48 18 56 44z"/>
    <path d="M520 550c34-4 52-22 56-44-28 2-48 18-56 44z"/>
  </g>

  <!-- rosas -->
  <g>
    <g transform="translate(455 300)">
      <circle r="86" fill="url(#rose)"/>
      <path d="M0-84c30 26 40 58 24 86-16 28-52 30-68 8-16-24-2-52 24-58 20-4 34 8 34 26 0 16-16 26-28 20" fill="none" stroke="#c76e8a" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <path d="M-64 34c22 29 58 45 96 31M44 60c25-17 37-45 28-73" fill="none" stroke="#f6c4d0" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    </g>
    <g transform="translate(325 390) rotate(-18)">
      <circle r="62" fill="url(#rose)"/>
      <path d="M0-60c22 19 30 42 17 62-12 20-38 21-49 5-11-17-1-37 18-42 15-3 25 6 25 19 0 11-12 19-21 14" fill="none" stroke="#c76e8a" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    </g>
  </g>

  <!-- margaritas -->
  <g transform="translate(555 400)">
    <g fill="#fffaf5">
      <ellipse rx="22" ry="58" cy="-46"/><ellipse rx="22" ry="58" cy="-46" transform="rotate(45)"/><ellipse rx="22" ry="58" cy="-46" transform="rotate(90)"/><ellipse rx="22" ry="58" cy="-46" transform="rotate(135)"/><ellipse rx="22" ry="58" cy="-46" transform="rotate(180)"/><ellipse rx="22" ry="58" cy="-46" transform="rotate(225)"/><ellipse rx="22" ry="58" cy="-46" transform="rotate(270)"/><ellipse rx="22" ry="58" cy="-46" transform="rotate(315)"/>
    </g>
    <circle r="28" fill="#ecc98d"/>
  </g>
  <g transform="translate(350 260) scale(.82)">
    <g fill="#fffaf5">
      <ellipse rx="20" ry="52" cy="-42"/><ellipse rx="20" ry="52" cy="-42" transform="rotate(60)"/><ellipse rx="20" ry="52" cy="-42" transform="rotate(120)"/><ellipse rx="20" ry="52" cy="-42" transform="rotate(180)"/><ellipse rx="20" ry="52" cy="-42" transform="rotate(240)"/><ellipse rx="20" ry="52" cy="-42" transform="rotate(300)"/>
    </g>
    <circle r="25" fill="#ecc98d"/>
  </g>

  <!-- tulipanes -->
  <g transform="translate(610 270) rotate(12)">
    <path d="M-30 0c0-38 16-62 30-72 14 10 30 34 30 72 0 24-14 40-30 40S-30 24-30 0z" fill="#efb0c0"/>
    <path d="M0-66c-4 28-4 58 0 100M-18-52c-2 24-2 50 0 84M18-52c2 24 2 50 0 84" fill="none" stroke="#d98aa1" stroke-width="3" opacity=".55" stroke-linecap="round"/>
  </g>
  <g transform="translate(300 470) rotate(-20) scale(.7)">
    <path d="M-30 0c0-38 16-62 30-72 14 10 30 34 30 72 0 24-14 40-30 40S-30 24-30 0z" fill="#f3c0ce"/>
  </g>

  <!-- lazo -->
  <path d="M450 780c-30-48-100-50-100-2 0 32 54 40 100 20" fill="#e3a2b6"/>
  <path d="M450 780c30-48 100-50 100-2 0 32-54 40-100 20" fill="#e3a2b6"/>
  <path d="M450 780c-14 54-30 90-58 130M450 780c14 54 30 90 58 130" fill="none" stroke="#d98aa1" stroke-width="14" stroke-linecap="round"/>
  <circle cx="450" cy="780" r="20" fill="#d98aa1"/>

  <!-- pétalos sueltos -->
  <g fill="#e8a3b6" opacity=".6">
    <ellipse cx="180" cy="600" rx="18" ry="10" transform="rotate(-25 180 600)"/>
    <ellipse cx="720" cy="660" rx="14" ry="8" transform="rotate(20 720 660)"/>
    <ellipse cx="740" cy="520" rx="10" ry="6" transform="rotate(-15 740 520)"/>
  </g>

  <rect width="900" height="1125" fill="#fff" filter="url(#grain)" opacity=".5"/>
</svg>

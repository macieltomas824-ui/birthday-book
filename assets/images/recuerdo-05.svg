<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="Ilustración de una noche estrellada sobre la ciudad">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2038"/>
      <stop offset=".5" stop-color="#4a3049"/>
      <stop offset="1" stop-color="#7c4b5e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2d1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff2d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e4"/>
      <stop offset="1" stop-color="#f2dba9"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d2c"/>
      <stop offset="1" stop-color="#1d1420"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#night)"/>

  <!-- estrellas -->
  <g fill="#fff6e8">
    <circle cx="120" cy="170" r="3" opacity=".9"/><circle cx="250" cy="100" r="2" opacity=".7"/>
    <circle cx="380" cy="190" r="2.5" opacity=".8"/><circle cx="500" cy="120" r="2" opacity=".6"/>
    <circle cx="650" cy="90" r="2.5" opacity=".9"/><circle cx="790" cy="190" r="2" opacity=".7"/>
    <circle cx="700" cy="330" r="2" opacity=".55"/><circle cx="180" cy="380" r="2" opacity=".6"/>
    <circle cx="330" cy="330" r="1.8" opacity=".5"/><circle cx="560" cy="280" r="1.8" opacity=".5"/>
    <circle cx="820" cy="430" r="2" opacity=".5"/><circle cx="90" cy="520" r="2" opacity=".45"/>
  </g>
  <g stroke="#fff6e8" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M310 120v24M298 132h24"/>
    <path d="M610 200v18M601 209h18"/>
    <path d="M470 380v14M463 387h14"/>
  </g>

  <!-- luna -->
  <circle cx="670" cy="250" r="150" fill="url(#moonGlow)"/>
  <path d="M710 160a100 100 0 1 0 44 143 84 84 0 1 1-44-143z" fill="url(#moon)"/>

  <!-- nubes -->
  <g fill="#8a5b71" opacity=".35">
    <ellipse cx="250" cy="470" rx="150" ry="24"/>
    <ellipse cx="330" cy="500" rx="110" ry="16"/>
    <ellipse cx="770" cy="520" rx="120" ry="18"/>
  </g>

  <!-- ciudad -->
  <path d="M0 720h70v-120h70v90h55V560h90v160h45V640h80v80h55V540h95v180h50V620h75v100h55V660h80v80h50V580h80v140h50v405H0z" fill="url(#city)"/>
  <g fill="#f4d9a0" opacity=".85">
    <rect x="88" y="620" width="12" height="16"/><rect x="118" y="620" width="12" height="16"/>
    <rect x="220" y="580" width="12" height="16"/><rect x="250" y="610" width="12" height="16"/>
    <rect x="330" y="510" width="14" height="18"/><rect x="362" y="550" width="14" height="18"/>
    <rect x="478" y="580" width="12" height="16"/><rect x="508" y="610" width="12" height="16"/>
    <rect x="618" y="660" width="12" height="16"/><rect x="648" y="690" width="12" height="16"/>
    <rect x="758" y="620" width="12" height="16"/><rect x="788" y="650" width="12" height="16"/>
  </g>

  <!-- dos figuras -->
  <g transform="translate(430 760)">
    <ellipse cx="40" cy="220" rx="110" ry="16" fill="#120b14" opacity=".6"/>
    <path d="M0 210c-6-60 8-100 34-100 22 0 32 26 34 62l6 40z" fill="#1b1220"/>
    <circle cx="34" cy="96" r="26" fill="#1b1220"/>
    <path d="M70 210c-4-54 6-90 30-90 20 0 30 24 32 56l4 36z" fill="#231729"/>
    <circle cx="100" cy="108" r="23" fill="#231729"/>
    <path d="M60 150c12 10 28 10 40 0" fill="none" stroke="#1b1220" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- árboles -->
  <g fill="#1c1320">
    <path d="M60 830c30-80 70-80 100 0z"/>
    <path d="M790 850c26-70 62-70 88 0z"/>
  </g>

  <rect width="900" height="1125" fill="#fff" filter="url(#grain)" opacity=".35"/>
</svg>

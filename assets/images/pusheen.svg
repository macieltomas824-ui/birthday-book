<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Ilustración de Pusheen sosteniendo un corazón">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c2c6"/>
      <stop offset="1" stop-color="#b2aaae"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ded7da"/>
      <stop offset="1" stop-color="#cdc5c9"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b7c8"/>
      <stop offset="1" stop-color="#e290a9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fbe4ea"/>
      <stop offset="1" stop-color="#fbe4ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <circle cx="400" cy="430" r="330" fill="url(#glow)"/>
  <ellipse cx="400" cy="742" rx="218" ry="34" fill="#d9a9b8" opacity=".28" filter="url(#soft)"/>

  <!-- estrellitas -->

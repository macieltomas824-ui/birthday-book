<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-label="Dibujo de una corona de hojas y flores">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#wobble)">
    <circle cx="400" cy="520" r="268" fill="none" stroke="#6e3550" stroke-width="2" opacity=".22" stroke-dasharray="1 10"/>
    <circle cx="400" cy="520" r="250" fill="none" stroke="#6e3550" stroke-width="3" opacity=".7"/>

    <!-- hojas alrededor -->
    <g fill="none" stroke="#6e3550" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <g id="leaf">
        <path d="M0 0c-28-10-46-34-44-62 28 2 48 24 44 62z"/>
        <path d="M0 0c-14-18-26-36-34-50"/>
      </g>
      <use href="#leaf" transform="rotate(18 400 520) translate(400 270)"/>
      <use href="#leaf" transform="rotate(48 400 520) translate(400 270) scale(-1 1)"/>
      <use href="#leaf" transform="rotate(82 400 520) translate(400 270)"/>
      <use href="#leaf" transform="rotate(118 400 520) translate(400 270) scale(-1 1)"/>
      <use href="#leaf" transform="rotate(154 400 520) translate(400 270)"/>
      <use href="#leaf" transform="rotate(196 400 520) translate(400 270) scale(-1 1)"/>
      <use href="#leaf" transform="rotate(232 400 520) translate(400 270)"/>
      <use href="#leaf" transform="rotate(268 400 520) translate(400 270) scale(-1 1)"/>
      <use href="#leaf" transform="rotate(302 400 520) translate(400 270)"/>
      <use href="#leaf" transform="rotate(338 400 520) translate(400 270) scale(-1 1)"/>
      <use href="#leaf" transform="rotate(400 400 520) translate(400 270)"/>
    </g>

    <!-- tallos -->
    <g fill="none" stroke="#6e3550" stroke-width="2.4" stroke-linecap="round" opacity=".8">
      <path d="M400 258c0 22 0 40 0 58"/>
      <path d="M662 520c-20 4-38 10-54 18"/>
      <path d="M138 520c20 4 38 10 54 18"/>
      <path d="M214 326c14 14 26 28 34 44"/>
      <path d="M586 326c-14 14-26 28-34 44"/>
    </g>

    <!-- flor arriba -->
    <g transform="translate(400 236)">
      <g fill="none" stroke="#6e3550" stroke-width="2.6">
        <ellipse cy="-38" rx="16" ry="34"/>
        <ellipse cy="-38" rx="16" ry="34" transform="rotate(60)"/>
        <ellipse cy="-38" rx="16" ry="34" transform="rotate(120)"/>
        <ellipse cy="-38" rx="16" ry="34" transform="rotate(180)"/>
        <ellipse cy="-38" rx="16" ry="34" transform="rotate(240)"/>
        <ellipse cy="-38" rx="16" ry="34" transform="rotate(300)"/>
        <circle r="17"/>
      </g>
      <g fill="#e3a2b6" opacity=".2">
        <circle r="34"/>
      </g>
    </g>

    <!-- flor derecha -->
    <g transform="translate(676 520)">
      <g fill="none" stroke="#6e3550" stroke-width="2.6">
        <ellipse cy="-28" rx="12" ry="26"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(72)"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(144)"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(216)"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(288)"/>
        <circle r="12"/>
      </g>
    </g>

    <!-- flor izquierda -->
    <g transform="translate(124 520)">
      <g fill="none" stroke="#6e3550" stroke-width="2.6">
        <ellipse cy="-28" rx="12" ry="26"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(72)"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(144)"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(216)"/>
        <ellipse cy="-28" rx="12" ry="26" transform="rotate(288)"/>
        <circle r="12"/>
      </g>
    </g>

    <!-- bayas -->
    <g fill="none" stroke="#6e3550" stroke-width="2.4">
      <circle cx="196" cy="316" r="7"/><circle cx="214" cy="298" r="5"/><circle cx="226" cy="320" r="4"/>
      <circle cx="596" cy="318" r="6"/><circle cx="612" cy="300" r="5"/>
      <circle cx="330" cy="792" r="5"/><circle cx="352" cy="804" r="4"/>
      <circle cx="470" cy="794" r="6"/><circle cx="492" cy="808" r="4"/>
    </g>

    <!-- hojas sueltas abajo -->
    <g fill="none" stroke="#6e3550" stroke-width="2.2" stroke-linecap="round" opacity=".55">
      <path d="M300 872c-24-8-38-28-36-50 22 2 38 20 36 50z"/>
      <path d="M500 890c24-8 38-28 36-50-22 2-38 20-36 50z"/>
      <path d="M400 906v-40"/>
    </g>

    <!-- centro -->
    <g fill="none" stroke="#6e3550" stroke-width="2.4" stroke-linecap="round">
      <path d="M352 560c10-16 30-16 40 0 10-16 30-16 40 0 10-16 30-16 40 0"/>
      <path d="M382 600h68M382 622h48"/>
      <path d="M400 522c5-8 15-5 15 2 0 6-9 10-15 14-6-4-15-8-15-14 0-7 10-10 15-2z" opacity=".8"/>
    </g>
  </g>
</svg>

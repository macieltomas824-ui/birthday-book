<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Marco de margaritas para código QR">
  <defs>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbe7ec"/>
      <stop offset=".8" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f3b9c8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c8b1"/>
      <stop offset="1" stop-color="#8fa487"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5dca0"/>
      <stop offset="1" stop-color="#dfb96b"/>
    </radialGradient>
  </defs>

  <!-- hojas -->
  <g fill="url(#leaf)">
    <path d="M300 300c-170 30-240 110-220 200 82-14 174-94 220-200z" opacity=".8"/>
    <path d="M300 300c170 30 240 110 220 200-82-14-174-94-220-200z" opacity=".8"/>
    <path d="M300 470c-60 24-96 70-90 112 46-10 84-50 90-112z" opacity=".6"/>
    <path d="M300 470c60 24 96 70 90 112-46-10-84-50-90-112z" opacity=".6"/>
  </g>

  <!-- pétalos -->
  <g>
    <g transform="translate(300 300) rotate(0)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(24)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(48)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(72)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(96)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(120)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(144)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(168)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(192)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(216)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(240)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(264)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(288)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(312)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
    <g transform="translate(300 300) rotate(336)"><ellipse cx="0" cy="-214" rx="30" ry="102" fill="url(#petal)" stroke="#eec3ce" stroke-width="1.5"/></g>
  </g>

  <!-- margaritas pequeñas -->
  <g transform="translate(96 140)">
    <g fill="#fffdfa" stroke="#eec3ce" stroke-width="1.2">
      <ellipse cy="-20" rx="10" ry="24"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(60)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(120)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(180)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(240)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(300)"/>
    </g>
    <circle r="10" fill="url(#core)"/>
  </g>
  <g transform="translate(506 456) scale(.9)">
    <g fill="#fffdfa" stroke="#eec3ce" stroke-width="1.2">
      <ellipse cy="-20" rx="10" ry="24"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(60)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(120)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(180)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(240)"/><ellipse cy="-20" rx="10" ry="24" transform="rotate(300)"/>
    </g>
    <circle r="10" fill="url(#core)"/>
  </g>

  <!-- centro para QR -->
  <circle cx="300" cy="300" r="151" fill="#fffaf7"/>
  <circle cx="300" cy="300" r="151" fill="none" stroke="#efc6d1" stroke-width="3"/>
  <circle cx="300" cy="300" r="158" fill="none" stroke="#f6d9e0" stroke-width="1.5"/>

  <!-- puntitos -->
  <g fill="#e3a2b6" opacity=".55">
    <circle cx="300" cy="36" r="5"/><circle cx="486" cy="114" r="5"/><circle cx="564" cy="300" r="5"/>
    <circle cx="486" cy="486" r="5"/><circle cx="300" cy="564" r="5"/><circle cx="114" cy="486" r="5"/>
    <circle cx="36" cy="300" r="5"/><circle cx="114" cy="114" r="5"/>
  </g>

  <g fill="#e3a2b6">
    <path d="M300 552c-20-24-54-20-54 4 0 17 28 24 54 11z"/>
    <path d="M300 552c20-24 54-20 54 4 0 17-28 24-54 11z"/>
    <circle cx="300" cy="554" r="9" fill="#cf7f99"/>
  </g>
</svg>
